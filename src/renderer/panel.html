<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:">
<title>Portal · Panel</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="portal.css">
<link rel="stylesheet" href="liongard-theme.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="hero">
  <div class="hero-top">
    <button type="button" class="switcher" id="switcher" aria-haspopup="dialog" title="Switch client or jump to a page (Ctrl K)">
      <span class="av" id="swAv" aria-hidden="true"></span>
      <span class="sw-t"><span id="portalTitle" class="hero-client"></span><span class="meta" id="swMeta"></span></span>
      <svg class="sw-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      <kbd class="kbd" id="swKbd">Ctrl K</kbd>
    </button>
    <nav class="ribbon" id="ribbon" aria-label="Client health by area" hidden></nav>
    <span class="hero-sp"></span>
    <button type="button" class="present-btn" id="presentBtn" aria-pressed="false" title="Present to client: hides the menu and technical controls (Esc exits)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/></svg><span>Present</span></button>
    <span class="fresh" id="fresh" hidden><i aria-hidden="true"></i><span id="freshText"></span></span>
    <div class="powered" role="img" aria-label="Powered by Liongard’s Data Lake"><small>Powered by</small><span>Liongard’s <em>Data Lake</em></span></div>
    <div class="theme3" id="themeSw" role="group" aria-label="Colour theme">
      <button type="button" data-theme="light" aria-pressed="false" aria-label="Light" title="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" data-theme="system" aria-pressed="false" aria-label="Match system" title="Match system"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg></button>
      <button type="button" data-theme="dark" aria-pressed="false" aria-label="Dark" title="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </div>
</header>
<main id="main" tabindex="-1">
  <div id="printCover" class="print-cover"></div>
  <header class="page-head">
    <nav class="crumb" aria-label="Breadcrumb"><a href="index.html" id="crumbHome" class="crumb-link">Portal</a><span aria-hidden="true">›</span><span id="crumbGroup"></span><span aria-hidden="true">›</span><span id="crumbPage" aria-current="page"></span></nav>
    <div class="phead">
      <div class="phead-t">
        <div class="ph-title"><h1 id="panelTitle"></h1><span class="chip c-ok present-flag">Client view</span></div>
        <p id="panelIntro"></p>
        <p id="panelIntroMore" class="intro-more" hidden></p>
      </div>
      <div class="page-acts no-print">
        <span class="status-line" id="statusLine" role="status"></span>
        <div class="seg seg-sm" id="tzSeg" role="group" aria-label="Times"><button type="button" data-v="utc" aria-pressed="true" title="Times in UTC, as Liongard shows them">UTC</button><button type="button" data-v="local" aria-pressed="false" title="Times in this computer’s time zone">Local</button></div>
        <details class="menu" id="exportMenu"><summary class="btn ghost"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Export</summary><div class="menu-list">
          <button type="button" id="pdfExec">PDF: executive summary</button>
          <button type="button" id="pdfFull">PDF: full technical report</button>
          <button type="button" id="exportBtn">HTML page</button>
          <span class="sub">CSV: use the CSV button above each table</span>
          <span class="menu-sep" role="separator"></span>
          <button type="button" id="howBuiltBtn" aria-controls="howBuiltBox" aria-expanded="false">Show how this page is built</button>
        </div></details>
        <button type="button" class="btn" id="refreshBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg><span id="refreshLabel">Refresh</span></button>
      </div>
    </div>
  </header>
  <section class="panel" id="panel">
    <div class="pb" id="panelBody"><div class="skel-wrap" role="status" aria-label="Loading"><div class="skel" style="width:40%"></div><div class="skel tall"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div></div>
    <details class="pf" id="howBuiltBox" hidden><summary>Diagnostics: how this page is built</summary><code id="howBuilt"></code></details>
  </section>
</main>
<footer id="footer"></footer>
<script src="shared.js"></script>
<script src="chrome.js"></script>
<script src="panel.js"></script>
</body>
</html>
